<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.com">
<head>
<meta charset="UTF-8">
<title>Search</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
	crossorigin="anonymous">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/fontawesome.min.css"
	integrity="sha512-B46MVOJpI6RBsdcU307elYeStF2JKT87SsHZfRSkjVi4/iZ3912zXi45X5/CBr/GbCyLx6M1GQtTKYRd52Jxgw=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/solid.min.css"
	integrity="sha512-/r+0SvLvMMSIf41xiuy19aNkXxI+3zb/BN8K9lnDDWI09VM0dwgTMzK7Qi5vv5macJ3VH4XZXr60ip7v13QnmQ=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />


<link rel="stylesheet" th:href="@{/css/searchPage.css}">
</head>
<body>
	<div class="container-fluid">
		<div class="row">
			<!-- Header Section -->
			<header>
				<div>
					<div class="row  d-flex align-items-center">
						<div class="col-md-4">
							<img th:src="@{image/logo-footer.png}" alt="Logo"
								class="mr-3 logo">
						</div>
						<div class="col-md-6 d-flex">
							<h1>Techforce Buddy</h1>
						</div>
						<div class="col-md-2 text-end">
							<button id="logout" class="btn rounded-circle">
								<i class="fa-solid fa-arrow-right-from-bracket"></i>
							</button>
						</div>
					</div>
				</div>
			</header>
		</div>
		<div class="row">
			<!-- Main Content Section -->
			<main class="container my-4">
				<div class="row">
					<div class="col-md-2">
						<div>
							<select class="dropdown select" id="version">
								<option value="v1" class="dropdown-item">v1.0</option>
								<option value="v2" class="dropdown-item" selected>Latest(v2.0)</option>
							</select>
						</div>
					</div>
					<div class="col-md-10">
						<div class="container container-width">
							<div class="row">
								<form class="d-flex justify-content-left">
									<div class="main">
										<input class=" search-input" type="search"
											placeholder="Search query" aria-label="Search" id="query">
										<span class="items-end">
											<button type="submit" id="searchQuery" class="rounded-circle">
												<i class="fa-solid fa-magnifying-glass"
													style="color: #EAD8B1;"></i>
											</button>
										</span>
									</div>
								</form>
							</div>
							<div class="row">
								<div id="accordion">
									<div class="card">
										<div class="card-header" id="headingOne">
											<h5 class="mb-0">
												<button class="btn btn-link" data-toggle="collapse"
													data-target="#collapseOne" aria-expanded="true"
													aria-controls="collapseOne">Summary</button>
											</h5>
										</div>

										<div id="collapseOne" class="collapse show"
											aria-labelledby="headingOne" data-parent="#accordion">
											<div class="card-body" id="summaryContent"></div>
										</div>
									</div>
									<div class="card ">
										<div class="card-header" id="headingTwo">
											<h5 class="mb-0">
												<button class="btn btn-link collapsed"
													data-toggle="collapse" data-target="#collapseTwo"
													aria-expanded="false" aria-controls="collapseTwo"
													id="moreDetails">
													Show more details</button>
											</h5>
										</div>
										<div id="collapseTwo" class="collapse"
											aria-labelledby="headingTwo" data-parent="#accordion">
											<div class="card-body" id="detailsContent"></div>
										</div>
									</div>
								</div>
								
								<div class="loader" id="load"></div>
							</div>
						</div>
					</div>
				</div>
			</main>
		</div>
		<div class="row">
			<!-- Footer Section -->
			<footer class="text-center py-3 mt-auto">
				<p>Created by @Unnati Jajal</p>
			</footer>
		</div>
	</div>

	<script type="text/javascript" th:src="@{/js/main.js}"></script>
	<script type="text/javascript" th:src="@{/js/searchPage.js}"></script>
	<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
		integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
		integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
		integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
		crossorigin="anonymous"></script>

	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/solid.min.js"
		integrity="sha512-L2znesU64H/rvdnaD4WBaRAmEcGvhBsVLXygPkhpgpUwcgjymD4amy68shdgZgLiIvyvV/vHRXAM4mTV8xqp+Q=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
