<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.com">
<head>
<meta charset="UTF-8">
<title>Home</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
	crossorigin="anonymous">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/fontawesome.min.css"
	integrity="sha512-B46MVOJpI6RBsdcU307elYeStF2JKT87SsHZfRSkjVi4/iZ3912zXi45X5/CBr/GbCyLx6M1GQtTKYRd52Jxgw=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/solid.min.css"
	integrity="sha512-/r+0SvLvMMSIf41xiuy19aNkXxI+3zb/BN8K9lnDDWI09VM0dwgTMzK7Qi5vv5macJ3VH4XZXr60ip7v13QnmQ=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<style type="text/css">
.div {
	margin-top: 20px;
}

.container-width {
	width: 40%;
}

.main {
	position: absolute;
	top: 25%;
	left: 53%;
	display: flex;
	transform: translate(-50%, -50%);
	border-radius: 28px;
	background: #3A6D8C;
	padding: 8px;
}

.search-input {
	width: 350px;
	border-radius: 50px;
	padding: 0px 10px;
	margin-left: 14px;
	outline: none;
	border: none;
	background: #3A6D8C;
	color: #EAD8B1;
}

.search-input::placeholder {
	color: #EAD8B1;
}

.search-input:focus {
	outline: none;
	background: #3A6D8C;
}

footer {
	background: #001F3F;
}

footer p {
	color: #edbc52;
}

.answer-card {
	position: absolute;
	top: 30%;
	left: 40%;
	margin-top: 20px;
	width: 30px;
	background: #fff1d3;
	color: #3A6D8C;
	visibility: hidden;
}


#logout {
	background-color: red;
	color: white;
	font-weight: bold;
	width: auto;
	height: 40px;
}


</style>
</head>
<body>
	<div class="container-fluid">
		<div class="row">
			<!-- Header Section -->
			<header
				style="background-color: #001F3F; font-family: 'Times New Roman', Times, serif; border-radius: 10px;">
				<div class="">
					<div class="row  d-flex align-items-center">
						<div class="col-md-4">
							<img th:src="@{image/logo-footer.png}" alt="Logo" class="mr-3"
								style="height: 40px;">
						</div>
						<div class="col-md-6 d-flex">
							<h1 style="padding: 20px; font-weight: bold; color: white;">Techforce
								Buddy</h1>
						</div>
						<div class="col-md-2 text-end">
							<button id="logout" class="btn rounded-circle">
								<i class="fa-solid fa-arrow-right-from-bracket"></i>
							</button>
							
						</div>

					</div>
				</div>
			</header>
		</div>
		<div class="row">
			<!-- Main Content Section -->
			<main class="container my-4">
				<div class="row">
					<div class="col-md-2">
						<div>
							<select class="dropdown btn"
								style="background-color: #6A9AB0; color: #EAD8B1; font-weight: bold;">
								<option value="v2" class="dropdown-item">v1.0</option>
								<option value="v1" class="dropdown-item" selected>Latest(v2.0)</option>
							</select>
						</div>
					</div>
					<div class="col-md-10">
						<div class="container container-width">
							<div class="row">
								<form class="d-flex justify-content-left">
									<div class="main">
										<input class=" search-input" type="search"
											placeholder="Search query" aria-label="Search" id="query">
										<span class="items-end">
											<button type="submit" id="searchVersionOne"
												class="btn rounded-circle">
												<i class="fa-solid fa-magnifying-glass"
													style="color: #EAD8B1;"></i>
											</button>

										</span>

									</div>

								</form>
							</div>
							<div class="row">
								<div class="card answer-card" style="width: 400px;">
									<div class="card-body" style="width: 300px;" id="responseDiv"></div>
								</div>

							</div>
						</div>
					</div>
				</div>
			</main>
		</div>
		<div class="row">
			<!-- Footer Section -->
			<footer class="text-center py-3 mt-auto"
				style="position: fixed; left: 0; bottom: 0;">
				<p>Created by @Unnati Jajal</p>
			</footer>
		</div>
	</div>





	<script type="text/javascript" th:src="@{/js/home.js}"></script>

	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
		integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
		integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
		crossorigin="anonymous"></script>

	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/solid.min.js"
		integrity="sha512-L2znesU64H/rvdnaD4WBaRAmEcGvhBsVLXygPkhpgpUwcgjymD4amy68shdgZgLiIvyvV/vHRXAM4mTV8xqp+Q=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
